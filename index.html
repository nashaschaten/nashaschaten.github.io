<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kana Trainer — By @ilparataraxia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>Kana Trainer</h1>
<p class="subtitle">Pilih baris kana yang ingin dipelajari — klik <em>Kata Berikutnya</em> untuk mengambil kata dari Jisho API.</p>
</header>


<section id="filters">
<!-- Filter grid akan di-inject oleh script.js -->
</section>


<section id="main">
<div id="word-card" class="card">
<div id="japanese" class="japanese">—</div>
<div id="reading" class="reading">—</div>
<div id="romaji" class="romaji">—</div>


<div id="controls" class="controls">
<button id="show-reading">Tampilkan Cara Baca</button>
<button id="show-meaning">Tampilkan Arti</button>
<button id="next-word" class="primary">Kata Berikutnya</button>
</div>


<div id="meaning" class="meaning" aria-live="polite">(Arti akan muncul di sini)</div>
<div id="meta" class="meta">Sumber arti: Jisho.org (Inggris)</div>
</div>
</section>


<footer>
<div>By : @ilparataraxia</div>
</footer>
</div>


<script src="script.js"></script>
</body>
</html>
